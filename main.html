<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котофейня</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <img src="logo1.jpg" alt="logo-img"class ="logo-img">
      <a href="main.html" class="logo">CoffeeCat</a>
      <a href="cart.html" class="cart-icon">
        Корзина: <span id="cart-count">0</span>
      </a>
      </div>
    </div>
  </header>

  <main class="container main-layout">

    <section class="products">
      <div class="cont">
        <h1 class="section-title">Менюшка</h1>
      <button class="open-filters-btn" id="open-filters">
        <img src="fil.png" alt="fil" class="fil">
      </button>
    </div>
<!--блок с поиском-->
  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="Поиск по названию...">
     <button id="search-clear" class="search-clear" type="button">✕</button>
    </div>

      <div class="products-grid">

      </div>
    </section>

  </main>

  <!-- ===== МОДАЛЬНОЕ ОКНО ФИЛЬТРА ===== -->
<div id="filter-modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" id="close-filters">✕</button>
    <h2 class="modal-title">Фильтр</h2>

    <!-- Категории -->
    <div class="filter-group">
      <h3 class="filter-group-title">Категория</h3>
      <div class="filter-options">
        <label class="filter-option">
          <input type="radio" name="category" value="all" checked>
          <span>Все</span>
        </label>
        <label class="filter-option">
          <input type="radio" name="category" value="hot">
          <span>Горячие</span>
        </label>
        <label class="filter-option">
          <input type="radio" name="category" value="cold">
          <span>Холодные</span>
        </label>
        <label class="filter-option">
          <input type="radio" name="category" value="special">
          <span>Авторские</span>
        </label>
      </div>
    </div>

    <!-- Цена -->
    <div class="filter-group">
      <h3 class="filter-group-title">Цена, ₽</h3>
      <div class="price-inputs">
        <input type="number" id="price-min" placeholder="от" min="0">
        <span>—</span>
        <input type="number" id="price-max" placeholder="до" min="0">
      </div>
    </div>

    <!-- Кнопки -->
    <div class="modal-actions">
      <button id="reset-filters" class="reset-btn">Сбросить</button>
      <button id="apply-filters" class="apply-btn">Применить</button>
    </div>
  </div>
</div>

  <script src="js.js"></script>
</body>
</html>
